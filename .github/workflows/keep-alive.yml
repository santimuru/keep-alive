name: Keep Streamlit Apps Alive

on:
  schedule:
    # Runs every 9 hours: 00:00, 09:00, 18:00 UTC
    - cron: "0 */9 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping telecom-churn-survival
        continue-on-error: true
        run: |
          curl --max-time 60 --silent --output /dev/null --write-out "Status: %{http_code}\n" \
            https://telecom-churn-survival-santiagomuru.streamlit.app

      - name: Ping customer-review-intelligence
        continue-on-error: true
        run: |
          curl --max-time 60 --silent --output /dev/null --write-out "Status: %{http_code}\n" \
            https://customer-review-intelligence-santiagomuru.streamlit.app

      - name: Ping customer-clv-prediction
        continue-on-error: true
        run: |
          curl --max-time 60 --silent --output /dev/null --write-out "Status: %{http_code}\n" \
            https://customer-clv-prediction-santiagomuru.streamlit.app

      - name: Ping tokyo-real-estate-explorer
        continue-on-error: true
        run: |
          curl --max-time 60 --silent --output /dev/null --write-out "Status: %{http_code}\n" \
            https://tokyo-real-estate-explorer-santiagomuru.streamlit.app
